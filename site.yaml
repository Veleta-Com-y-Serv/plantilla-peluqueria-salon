  productos:
    activa: true
    antetitulo: Marcas que usamos
    titulo: Lo que te ponemos, también te lo llevas
    texto: "Trabajamos con marcas profesionales y te recomendamos solo lo que tu pelo necesita. Pregunta en el mostrador."
    items:
      - { titulo: Aurea Color, texto: Tintes sin amoniaco }
      - { titulo: Botánica Pro, texto: Champús sin sulfatos }
      - { titulo: Nácar, texto: Mascarillas y aceites }
      - { titulo: Lino y Sal, texto: Fijación y textura }
      - { titulo: Pétalo, texto: Esmaltes y cuidado de uñas }

  ofertas:
    activa: true
    antetitulo: Promociones
    titulo: Este mes en el salón
    texto: "Promociones de temporada. Pregunta al reservar: se pueden combinar con el bono de fidelidad."
    ofertas:
      - { titulo: Martes de color, texto: "Tinte de raíz y ritual de hidratación los martes por la mañana.", precio: "52 €", validez: Hasta el 30 de noviembre }
      - { titulo: Novias del próximo año, texto: "Reserva tu fecha y te regalamos la prueba de maquillaje.", precio: "Prueba gratis", validez: Bodas de 2027 }
      - { titulo: Trae a una amiga, texto: "Si venís juntas a cortar, el segundo corte va a mitad de precio.", precio: "-50 %", validez: Todo el año }

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que dicen al salir
    testimonios:
      - { texto: "Llevaba años sin atreverme con el balayage e Inés me lo explicó todo con paciencia. El color ha quedado precioso y natural.", autor: Raquel M., nota: Balayage }
      - { texto: "Marta me peinó para la boda de mi hermana y aguantó perfecto hasta la madrugada. La prueba previa me dio mucha tranquilidad.", autor: Elena S., nota: Peinado de evento }
      - { texto: "Salón tranquilo, puntual y con gusto. Lucía es la única que ha sabido cortarme el pelo corto como yo quería.", autor: Pilar G., nota: Corte }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir
    texto: "Si tu duda no está aquí, escríbenos por WhatsApp y te contestamos enseguida."
    preguntas:
      - { pregunta: "¿Hace falta reservar cita?", respuesta: "Es lo mejor, sobre todo para color y sábados. Si pasas sin cita y hay hueco, te atendemos encantadas." }
      - { pregunta: "¿Cuánto tarda un balayage?", respuesta: "Entre dos horas y media y tres, según el largo y el punto de partida. Te lo confirmamos en el diagnóstico gratis." }
      - { pregunta: "¿Hacéis prueba de color antes del tinte?", respuesta: "Sí, y es gratis. Si es tu primera vez con nosotras, ven 48 horas antes para la prueba de tolerancia." }
      - { pregunta: "¿Peináis a domicilio para bodas?", respuesta: "Sí, para novias y acompañantes en Badajoz y alrededores. Pregúntanos disponibilidad y desplazamiento." }
      - { pregunta: "¿Qué pasa si no puedo ir a mi cita?", respuesta: "Avísanos con 24 horas por teléfono o WhatsApp y la cambiamos sin problema." }

  reserva:
    activa: true
    antetitulo: Reserva
    titulo: Pide tu cita
    texto: "Dinos qué te quieres hacer, con quién y cuándo te viene bien. Te confirmamos la hora por teléfono o WhatsApp en el mismo día."
    imagen: /fotos/reserva.jpg
    nota: "Sin señal ni pago por adelantado. Si tienes que cambiarla, avísanos con 24 horas."
    boton_formulario: Pedir mi cita
    franjas: "Mañana (9:30 a 14:00); Mediodía (14:00 a 16:00); Tarde (16:00 a 20:00); Sábado por la mañana"
    items:
      - { titulo: Elige el servicio, texto: "Si no lo tienes claro, pide un diagnóstico gratis." }
      - { titulo: Elige estilista, texto: "O deja que te asignemos según lo que quieras hacerte." }
      - { titulo: Te confirmamos, texto: "Te llamamos o escribimos con la hora exacta." }

  contacto:
    activa: true
    antetitulo: Contacto
    titulo: Te esperamos en Menacho
    texto: "En la calle peatonal de Menacho, a dos minutos de la plaza de España. Hay aparcamiento público a la vuelta de la esquina."
    boton_formulario: Enviar mensaje
    horario:
      - { dia: Martes a viernes, horas: "9:30 a 20:00" }
      - { dia: Sábado, horas: "9:00 a 14:30" }
      - { dia: Domingo y lunes, horas: Cerrado }
